name: Main workflow
on: push
env:
  github_username: ${{ github.actor }}
  github_password: ${{ secrets.GITHUB_TOKEN }}
  GIT_COMMIT: ${{ github.sha }}
  snyk_API: ${{ secrets.SNYKAPIKEY }}
  
jobs:
  Snyk_Check:
    runs-on: ubuntu-latest
    steps:
      - name: Clone down repository
        uses: actions/chekcout@v4
        #with:
        #  name: code
        #  path: .
        #  include-hidden-files: true
      - name: Snyk Install
        run: |
             curl --compressed https://downloads.snyk.io/cli/stable/snyk-linux -o snyk
             chmod +x ./snyk
             mv ./snyk /usr/local/bin/
      - name: Snyk out
        run: snyk out ${{ secrets.SNYKAPIKEY }}
      - name: Snyk test
        run: snyk test --all-projects | true
        # with:
        #  name: code
        #  path: .
  Build:
    runs-on: ubuntu-latest
    container: gradle:6-jdk11
    steps:
      - name: Clone down repository
        uses: actions/checkout@v4
      - name: Build application
        run: ci/build-app.sh
      - name: Test
        run: ci/unit-test-app.sh
      - name: Upload repo
        uses: actions/upload-artifact@v4
        with:
          name: code
          path: .
          include-hidden-files: true
  Linting:
    runs-on: ubuntu-latest
    needs: [Build]
    steps:
      - name: Download code
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .
      - name: Run linting
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLE_ERRORS: true
  Docker-image:
    runs-on: ubuntu-latest
    needs: [Build]
    permissions:
      packages: write
    steps:
      - name: Download code
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .
      - name: build docker
        run: bash ci/build-docker.sh
      - name: push docker
        run: bash ci/push-docker.sh
  Component-test:
    runs-on: ubuntu-latest
    needs: Docker-image
    steps:
      - name: Download code
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .
      - name: Execute component test
        run: bash ci/component-test.sh
  Performance-test:
    runs-on: ubuntu-latest
    needs: Docker-image
    steps:
      - name: Download code
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .
      - name: Execute performace test
        run: bash ci/performance-test.sh
